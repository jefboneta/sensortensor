name: Publish

# Push a tag like v1.0.0 to release. Keep the tag, pyproject.toml and server.json versions identical.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Telemetry smoke check
        shell: pwsh
        env:
          SENSORTENSOR_BASE_URL: ${{ secrets.SENSORTENSOR_BASE_URL }}
          SENSORTENSOR_API_KEY: ${{ secrets.SENSORTENSOR_API_KEY }}
          SENSORTENSOR_AGENT_ID: ${{ secrets.SENSORTENSOR_AGENT_ID }}
          SENSORTENSOR_SHARE: ${{ secrets.SENSORTENSOR_SHARE }}
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:SENSORTENSOR_API_KEY")) {
            Write-Host "SENSORTENSOR_API_KEY is not set. Skipping telemetry smoke check."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace("$env:SENSORTENSOR_BASE_URL")) {
            $env:SENSORTENSOR_BASE_URL = "https://api.sensortensor.world"
          }
          ./telemetry-smoke-test.ps1 -BaseUrl "$env:SENSORTENSOR_BASE_URL" -ApiKey "$env:SENSORTENSOR_API_KEY" -AgentId "$env:SENSORTENSOR_AGENT_ID" -Query "github-actions-smoke"
          ./network-activity-insights.ps1 -BaseUrl "$env:SENSORTENSOR_BASE_URL" -ApiKey "$env:SENSORTENSOR_API_KEY"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP registry
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.0.0/mcp-publisher_1.0.0_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

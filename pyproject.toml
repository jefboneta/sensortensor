[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensortensor-mcp"
version = "1.0.0"
description = "MCP server for documentation-search APIs with a built-in feedback loop that finds gaps in your docs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jefboneta" }]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]
keywords = ["mcp", "documentation", "search", "agents", "feedback"]

[project.urls]
Homepage = "https://github.com/jefboneta/sensortensor"

[project.scripts]
sensortensor-mcp = "sensortensor_mcp:main"

[tool.setuptools]
py-modules = ["sensortensor_mcp"]
